<script>

  const URL = 'https://crud-operations-e909a-default-rtdb.firebaseio.com/userdata/users.json';

const fetchData = () => {
  fetch(URL)
    .then(response => response.json())
    .then(data => {

      Object.entries(data).forEach(([key, value]) => {
        console.log(`User: ${value.name}, Email: ${value.email}`);
      });
    })
    .catch(error => console.error("Error fetching data:", error));
};

fetchData();

const deleteData = (key) => {
  fetch(`https://crud-operations-e909a-default-rtdb.firebaseio.com/userdata/users/${key}.json`, {
    method: 'DELETE',
  })
  .then(response => {
    if (response.ok) {
      console.log("Data deleted successfully");
    } else {
      console.error("Error deleting data");
    }
  })
  .catch(error => console.error("Error deleting data:", error));
};
