<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>QuickCart</title>
</head>
<body>

<h2>Add Item</h2>

<form id="itemForm">
  <input type="text" id="name" placeholder="Item Name" required />
  <input type="number" id="qty" placeholder="Quantity" min="1" required />
  <input type="number" id="price" placeholder="Price ₹" min="0" required />
  <select id="category">
    <option>Dairy</option>
    <option>Produce</option>
    <option>Snacks</option>
  </select>
  <button type="submit">Add Item</button>
</form>



<h3 id="summary">Total items: 0 | Grand cost: ₹0</h3>

<div>
  <button onclick="filterItems('All')">All</button>
  <button onclick="filterItems('Dairy')">Dairy</button>
  <button onclick="filterItems('Produce')">Produce</button>
  <button onclick="filterItems('Snacks')">Snacks</button>
</div>



<h2>Item List</h2>
<ul id="itemList"></ul>

<div id="toast" style="display:none; background: #222; color: #fff; padding: 10px; margin-top: 10px;">
  Item deleted. <button onclick="undoDelete()">Undo</button>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";
  import { getDatabase, ref, push, remove, get } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDvYFi2g_17dIH2rSRx7tnUUKGcRE9Goa0",
    authDomain: "my-firebase-app-3eda9.firebaseapp.com",
    databaseURL: "https://my-firebase-app-3eda9-default-rtdb.firebaseio.com",
    projectId: "my-firebase-app-3eda9",
    storageBucket: "my-firebase-app-3eda9.appspot.com",
    messagingSenderId: "714251733227",
    appId: "1:714251733227:web:cf9d17a31ff7f0995f16ae",
    measurementId: "G-QG79329V0X"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);
  const itemRef = ref(db, "items");


  const itemList = document.getElementById("itemList");
  const summary = document.getElementById("summary");
  const toast = document.getElementById("toast");

  let allItems = [];
  let lastDeleted = null;
  let undoTimer;

  const form = document.getElementById("itemForm");
  const nameInput = document.getElementById("name");
  const qtyInput = document.getElementById("qty");
  const priceInput = document.getElementById("price");
  const categoryInput = document.getElementById("category");



  form.addEventListener("submit", async (e) => {
    e.preventDefault();

    const item = {
      name: nameInput.value,
      qty: Number(qtyInput.value),
      price: Number(priceInput.value),
      category: categoryInput.value
    };

    if (navigator.onLine) {
      await push(itemRef, item);
    } else {
      const pending = JSON.parse(localStorage.getItem("pending")) || [];
      pending.push(item);
      localStorage.setItem("pending", JSON.stringify(pending));
    }

    form.reset();
    ItemData();
  });







  function ItemData() {
    get(itemRef).then(snapshot => {
      const data = snapshot.val() || {};
      allItems = [];

      for (let id in data) {
        allItems.push({ id, ...data[id] });
      }

      renderItems(allItems);
    });
  }





  function renderItems(items) {
    itemList.innerHTML = "";

    items.forEach(item => {
      const li = document.createElement("li");
      li.id = item.id;
      li.innerHTML = `${item.name} × ${item.qty} — ₹${item.price}
        <button onclick="deleteItem('${item.id}')">🗑️</button>`;
      itemList.appendChild(li);
    });

    const totalQty = items.reduce((sum, item) => sum + item.qty, 0);
    const totalCost = items.reduce((sum, item) => sum + item.qty * item.price, 0);
    summary.innerText = `Total items: ${totalQty} | Grand cost: ₹${totalCost}`;
  }









  function filterItems(category) {
    if (category === "All") {
      renderItems(allItems);
    } else {
      const filtered = allItems.filter(item => item.category === category);
      renderItems(filtered);
    }
  }




  function deleteItem(id) {
    const item = allItems.find(i => i.id === id);
    lastDeleted = { id, item };
    localStorage.setItem("lastDeleted", JSON.stringify(lastDeleted));

    remove(ref(db, `items/${id}`));
    ItemData();

    toast.style.display = "block";
    clearTimeout(undoTimer);
    undoTimer = setTimeout(() => {
      toast.style.display = "none";
      localStorage.removeItem("lastDeleted");
    }, 5000);
  }

  function undoDelete() {
    const data = JSON.parse(localStorage.getItem("lastDeleted"));
    if (data) {
      push(itemRef, data.item);
      toast.style.display = "none";
      localStorage.removeItem("lastDeleted");
      ItemData();
    }
  }

  window.addEventListener("online", () => {
    const pending = JSON.parse(localStorage.getItem("pending")) || [];
    pending.forEach(item => push(itemRef, item));
    localStorage.removeItem("pending");
    ItemData();
  });

  ItemData();

</script>

</body>
</html>
