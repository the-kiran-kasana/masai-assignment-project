<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Student Record Manager</title>
    <style>
        form {
          width:300px;
          border:2px solid #ccc;
          text-align:center;
          padding:50px;
          margin:50px;
          box-shadow: rgba(0, 0, 0, 0.24) 0px 3px 8px;
         display: block;
         gap:20px;
        }
    </style>
</head>
<body>
<h1 style="text-align:center;" >Add Student Record</h1>

   <div>
     <form id="userForm">
         <label>Name : </label>
         <input type="text" id="nameId" placeholder="Enter name ...">
         <br>
         <label>Batch : </label>
         <input type="text" id="batchId" placeholder="Enter Batch ...">
         <br>
         <label>Age : </label>
         <input type="number"  id="ageId" placeholder="Enter your Age ...">
         <br>
         <label>Score : </label>
         <input type="number" id="scoreId" placeholder="Enter your Score ...">
         <br>
         <button id="submitBtn" type="submit" onclick="submitBtnfn()">submit</button>
     </form>

       <h2>Display Student Records</h2>
       <div id="StudentRecords"></div>


   </div>
</body>

<script type="module" src="script.js"></script>
</html>
